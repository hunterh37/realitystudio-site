<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bee Buzz · RealityFilter</title>
<meta property="og:title" content="Bee Buzz">
<meta property="og:description" content="Open the Bee Buzz lens in RealityFilter.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://realityfilter.dicyaninlabs.org/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-itunes-app" content="app-id=6829603370">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font:17px/1.3 -apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;box-sizing:border-box;text-align:center}
small{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.5}
h1{margin:0;font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
a.go{color:#000;background:#fff;padding:16px 36px;border-radius:999px;text-decoration:none;font-weight:600}
a.open{color:#fff;opacity:.5;font-size:15px;text-decoration:none}
</style></head><body><main>
<small>RealityFilter</small>
<h1 id="t">Bee Buzz</h1>
<a class="go" id="go" href="https://apps.apple.com/app/id6829603370">Get the app</a>
<a class="open" id="open" href="realityfilter://">Open in app</a>
</main>
<script>
var parts=location.pathname.split('/').filter(Boolean),id=decodeURIComponent(parts[1]||'');
if(id){
function setName(name){document.getElementById('t').textContent=name;document.title=name+' · RealityFilter'}
setName(id.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[-_]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()}));
fetch('/lens/names.json').then(function(r){return r.json()}).then(function(m){if(m[id])setName(m[id])}).catch(function(){});
var app='realityfilter://lens/'+encodeURIComponent(id);
document.getElementById('open').href=app;
document.getElementById('go').addEventListener('click',function(){try{navigator.clipboard.writeText(location.href)}catch(e){}});
}
var PT='';if(PT){var g=document.getElementById('go');g.href+='?pt='+PT+'&ct=share-lens&mt=8'}
</script></body></html>
